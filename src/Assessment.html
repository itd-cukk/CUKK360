<!-- Assessment.html — Daftar tugas + wizard Penilaian 360°. Fragment. -->
<section id="view-assessment" class="view hidden">
  <div class="card">
    <div class="row"><button class="secondary" data-nav="home">&larr; Beranda</button>
      <h2 class="mb0" style="flex:1">Penilaian 360°</h2></div>
    <p class="sub" id="asg-periode">—</p>
    <div class="pbar mt8"><i id="asg-pbar" style="width:0%"></i></div>
    <p class="muted" id="asg-count">—</p>
    <div id="asg-list" class="mt16"></div>
  </div>
</section>

<!-- Wizard -->
<section id="view-wizard" class="view hidden">
  <div class="card">
    <div class="row">
      <button class="secondary" onclick="Wizard.confirmExit()">&larr; Kembali</button>
      <h2 class="mb0" style="flex:1">Formulir Penilaian</h2>
    </div>
    <div id="wz-context" class="card" style="background:var(--chip);margin-top:12px"></div>

    <div class="pbar mt8"><i id="wz-pbar" style="width:0%"></i></div>
    <p class="muted" id="wz-progress">0 dari 0 terjawab</p>

    <div id="wz-step-kal-core"></div>
    <div id="wz-step-core"></div>
    <div id="wz-step-kal-teknis"></div>
    <div id="wz-step-teknis"></div>

    <label>Catatan khusus untuk pemangku jabatan (opsional)</label>
    <textarea id="wz-catatan" placeholder="Masukan/observasi tambahan…"></textarea>

    <div id="wz-unanswered" class="muted mt8"></div>
    <div class="sticky-actions">
      <span class="muted" id="wz-autosave" style="align-self:center;font-size:12px"></span>
      <button class="green" id="wz-submit" onclick="Wizard.submit()">Kirim Penilaian</button>
    </div>
  </div>
</section>
