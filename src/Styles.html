<!-- Styles.html — di-include via <?!= include('Styles') ?> -->
<style>
  :root {
    --kk-merah: #c0392b;
    --kk-merah-d: #a5281c;
    --kk-biru: #1e6fb8;
    --kk-hijau: #27913f;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1f2733;
    --muted: #6b7683;
    --border: #e3e8ee;
    --chip: #eef2f6;
    --shadow: 0 2px 10px rgba(20, 30, 50, .06), 0 1px 3px rgba(20, 30, 50, .08);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --card: #1b212b; --text: #e7ecf2; --muted: #9aa6b3;
      --border: #2b333f; --chip: #232b36;
      --shadow: 0 2px 12px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --card: #1b212b; --text: #e7ecf2; --muted: #9aa6b3;
    --border: #2b333f; --chip: #232b36; --shadow: 0 2px 12px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  a { color: var(--kk-biru); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
  .hidden { display: none !important; }

  /* Header */
  .appbar {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(100deg, var(--kk-merah), var(--kk-merah-d));
    color: #fff; box-shadow: var(--shadow);
  }
  .appbar .wrap { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .appbar h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .appbar .sp { flex: 1; }
  .appbar button { background: rgba(255,255,255,.16); color:#fff; border:0; }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .card p.sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }

  .menu-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 640px) { .menu-grid { grid-template-columns: repeat(3, 1fr); } }
  .menu-card {
    position: relative; cursor: pointer; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; background: var(--card);
    box-shadow: var(--shadow); transition: transform .12s ease, box-shadow .12s ease;
  }
  .menu-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(20,30,50,.12); }
  .menu-card .ico { font-size: 30px; }
  .menu-card h3 { margin: 8px 0 4px; font-size: 16px; }
  .menu-card small { color: var(--muted); }
  .badge {
    position: absolute; top: 12px; right: 12px; background: var(--kk-merah);
    color: #fff; border-radius: 999px; font-size: 12px; padding: 2px 9px; font-weight: 700;
  }
  .badge.ok { background: var(--kk-hijau); }

  /* Forms */
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  input[type=text], input[type=password], input[type=date], input[type=number], select, textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--card); color: var(--text); font-size: 15px;
  }
  textarea { min-height: 84px; resize: vertical; }
  button {
    cursor: pointer; border: 0; border-radius: 12px; padding: 11px 18px;
    font-size: 15px; font-weight: 600; background: var(--kk-merah); color: #fff;
  }
  button.secondary { background: var(--chip); color: var(--text); }
  button.blue { background: var(--kk-biru); }
  button.green { background: var(--kk-hijau); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 0 0 auto; }

  /* Scale chips */
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; }
  .chip {
    text-align: center; border: 1.5px solid var(--border); border-radius: 12px;
    padding: 12px 6px; background: var(--chip); font-weight: 700; user-select: none;
    transition: all .1s ease; font-size: 14px;
  }
  .chip small { display: block; font-weight: 500; font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.25; }
  .chip.sel { background: var(--kk-biru); color: #fff; border-color: var(--kk-biru); }
  .chip.sel small { color: rgba(255,255,255,.85); }
  .chip.narrow { grid-column: span 5; text-align: left; padding: 12px 14px; }
  @media (min-width: 640px) { .scale.narrative { grid-template-columns: 1fr; } .chip.narrow { grid-column: auto; } }

  .q { border-top: 1px solid var(--border); padding: 16px 0; }
  .q:first-child { border-top: 0; }
  .q .qt { font-weight: 600; }
  .q .qk { font-size: 12px; color: var(--kk-biru); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .q.unanswered { background: rgba(192,57,43,.06); border-radius: 10px; padding-left: 10px; padding-right: 10px; }

  /* Progress */
  .pbar { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; }
  .pbar > i { display: block; height: 100%; background: var(--kk-hijau); border-radius: 999px; transition: width .25s ease; }

  .sticky-actions {
    position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--border);
    padding: 12px 0; margin-top: 8px; display: flex; gap: 10px; justify-content: flex-end;
  }

  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th, table.data td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  table.data th { color: var(--muted); font-weight: 700; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
  .pill.self { background: #e8f0fe; color: #1e6fb8; }
  .pill.peer { background: #e9f7ee; color: #27913f; }
  .pill.atasan { background: #fdecea; color: #c0392b; }
  .pill.bawahan { background: #fff4e5; color: #b26a00; }
  .pill.done { background: #e9f7ee; color: #27913f; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #1f2733; color: #fff; padding: 12px 18px; border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25); z-index: 60; font-size: 14px; max-width: 90vw;
  }
  .toast.err { background: var(--kk-merah); }
  .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .muted { color: var(--muted); }
  .center { text-align: center; }
  .mt8{margin-top:8px}.mt16{margin-top:16px}.mb0{margin-bottom:0}
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
</style>
